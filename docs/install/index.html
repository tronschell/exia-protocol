<meta name="color-scheme" content="dark">

<title>Install in Exia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #fff; --muted: #8e8e93; --line: #2c2c2e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Geist, -apple-system, system-ui, sans-serif; }
  main { min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; }
  .card { width: 100%; max-width: 420px; display: grid; gap: 24px; justify-items: center; text-align: center; }
  .mark { width: 88px; height: 88px; border-radius: 20px; display: grid; place-items: center; border: 1px solid var(--line); overflow: hidden; }
  .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mark svg { width: 60px; height: 30px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .desc { margin: -12px 0 0; color: var(--muted); font-size: 16px; }
  .items { list-style: none; margin: 0; padding: 0; width: 100%; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .items li { display: flex; gap: 12px; align-items: center; padding: 12px 16px; text-align: left; font-size: 16px; }
  .items li + li { border-top: 1px solid var(--line); }
  .ic { position: relative; width: 28px; height: 28px; border-radius: 7px; flex: none; overflow: hidden; background: #1c1c1e;
        display: grid; place-items: center; font-size: 14px; font-weight: 600; color: var(--muted); }
  .ic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .open { display: block; line-height: 0; border-radius: 28px; }
  .open:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .badge { width: 252px; height: 56px; }
  .get { color: var(--muted); font-size: 15px; text-decoration: none; margin-top: -8px; }
  .get:hover, .get:focus-visible { color: var(--fg); }
  .error { color: #ff453a; font-size: 16px; }
  [hidden] { display: none !important; }
</style>

</main>
<script>
(() => {
  const param = new URLSearchParams(location.search).get('url');
  let target = null;
  try {
    const url = new URL(param);
    if (url.protocol === 'https:' || url.protocol === 'http:') target = url;
  } catch {}
  const open = document.getElementById('open');
  if (!target) {
    open.replaceWith(Object.assign(document.createElement('p'), { className: 'error', textContent: 'This install link is missing its package URL.' }));
    return;
  }
  open.href = 'projectexia://add?url=' + encodeURIComponent(target.href);

  const text = (value, max) => typeof value === 'string' ? value.slice(0, max) : '';
  const https = (value) => { try { const u = new URL(value); return u.protocol === 'https:' ? u.href : null; } catch { return null; } };
  // The item URL's origin, even when its path still has {{templates}}.
  const origin = (value) => { const m = /^https:\/\/[^/{}?#]+/.exec(typeof value === 'string' ? value : ''); return m ? m[0] : null; };
  const json = (url) => fetch(url, { headers: { accept: 'application/json' } }).then((r) => r.ok ? r.json() : Promise.reject());

  // Icons in the order SPEC.md 2.4 gives: the item's icon, the addon's manifest logo or the extension's icon,
  // then the site's apple-touch-icon and favicon. Each candidate that fails to load gives way to the next.
  async function iconCandidates(item) {
    const list = [];
    const own = https(item.icon);
    if (own) list.push(own);
    const url = typeof item.url === 'string' ? item.url : '';
    const base = origin(url);
    try {
      if (item.type === 'addon' && base) {
        const plain = url.includes('{{') ? base + '/manifest.json' : url;
        const logo = https((await json(plain)).logo);
        if (logo) list.push(logo);
      } else if (item.type === 'repository' && Array.isArray(item.ids) && item.ids.length === 1 && !url.includes('{{')) {
        const index = url.endsWith('.json') ? url : url.replace(/\/$/, '') + '/index.min.json';
        const data = await json(index);
        const sources = Array.isArray(data) ? data : (data && data.sources) || [];
        const source = sources.find((s) => s && s.id === item.ids[0]);
        const path = source && (source.iconURL || (source.icon && 'icons/' + source.icon));
        if (path) list.push(new URL(path, index).href);
      }
    } catch {}
    if (base) list.push(base + '/apple-touch-icon.png', base + '/favicon.ico');
    return list;
  }

  function showFirst(tile, candidates) {
    const next = () => {
      const src = candidates.shift();
      if (!src) return;
      const img = new Image();
      img.alt = '';
      img.onload = () => { tile.querySelector('img')?.remove(); tile.append(img); };
      img.onerror = next;
      img.src = src;
    };
    next();
  }

  // Shows the package's name and items when its host allows cross-origin reads (GitHub Pages and gists do).
  json(target.href)
    .then((pkg) => {
      if (!pkg || pkg.exia !== 1) return;
      const name = text(pkg.name, 40);
      if (name) { document.getElementById('name').textContent = name; document.title = `Install ${name} in Exia`; }
      const desc = text(pkg.description, 80);
      if (desc) { const d = document.getElementById('desc'); d.textContent = desc; d.hidden = false; }
      const icon = https(pkg.icon);
      if (icon) {
        const img = new Image();
        img.alt = '';
        img.onload = () => { const mark = document.getElementById('mark'); mark.replaceChildren(img); };
        img.src = icon;
      }
      const list = document.getElementById('items');
      for (const item of Array.isArray(pkg.items) ? pkg.items.slice(0, 50) : []) {
        if (!item || typeof item !== 'object') continue;
        const title = text(item.title, 40);
        const li = document.createElement('li');
        const tile = document.createElement('span');
        tile.className = 'ic';
        tile.textContent = title.slice(0, 1).toUpperCase();
        li.append(tile, document.createTextNode(title));
        list.append(li);
        iconCandidates(item).then((c) => showFirst(tile, c));
      }
      list.hidden = !list.children.length;
    })
    .catch(() => {});
})();
</script>
